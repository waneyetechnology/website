<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Waneye API headline record"><title>Headline record — Waneye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../page.css">
</head>
<body><div id="siteHeader"></div><main id="main" class="page-shell">
  <section class="detail-hero"><div class="breadcrumbs"><a href="../index.html">Intelligence</a><i>/</i><a href="index.html">Newsroom</a><i>/</i><span>Headline record</span></div><p class="kicker" id="sourceIndex"></p><h1 id="articleTitle"></h1><div class="detail-meta"><div><span>SOURCE</span><strong id="publisher"></strong></div><div><span>PUBLISHED AT</span><strong id="publishDate"></strong></div><div><span>EDITION</span><strong id="articleEdition"></strong></div><div><span>API RECORD</span><strong id="apiRecord"></strong></div></div></section>
  <section class="page-section"><div class="container article-layout"><article class="prose"><p class="kicker">URL</p><p class="source-url" id="recordUrl"></p><p class="kicker">FAVICON</p><p class="source-url" id="recordFavicon"></p><p class="kicker">IMAGE</p><p class="source-url" id="recordImage"></p></article><aside class="detail-aside"><div class="aside-card"><p class="kicker">ORIGINAL REPORTING</p><h3 id="sourceCardTitle"></h3><a class="source-button" id="originalLink" target="_blank" rel="noreferrer">Open source <span>↗</span></a></div></aside></div></section>
</main><div id="siteFooter"></div><script src="../api-snapshot.js"></script><script src="../data.js"></script><script src="../pages.js"></script><script>
const P=WaneyePage;const region=P.safeRegion(P.query('region','global'));const zh=region==='cn';P.mountChrome('newsroom','../',zh?'zh':'en');const r=P.REPORTS[region];const wanted=Number(P.query('id',String(r.news[0].index)));const n=r.news.find(x=>x.index===wanted)||r.news[0];
const display=value=>value===null?'null':String(value);document.title=`${n.title} — Waneye`;document.querySelector('#sourceIndex').textContent=`${zh?'新闻记录':'HEADLINE RECORD'} #${String(n.index).padStart(3,'0')}`;document.querySelector('#articleTitle').textContent=n.title;document.querySelector('#publisher').textContent=display(n.source);document.querySelector('#publishDate').textContent=display(n.publishedAt);document.querySelector('#articleEdition').textContent=P.REGION_NAMES[region];document.querySelector('#apiRecord').textContent=`headlines[${n.index-1}]`;document.querySelector('#recordUrl').textContent=display(n.url);document.querySelector('#recordFavicon').textContent=display(n.favicon);document.querySelector('#recordImage').textContent=display(n.image);document.querySelector('#sourceCardTitle').textContent=display(n.source);document.querySelector('#originalLink').href=n.url;
if(zh){const crumbs=document.querySelectorAll('.breadcrumbs a');crumbs[0].textContent='市场情报';crumbs[1].textContent='新闻中心';document.querySelector('.breadcrumbs span').textContent='新闻记录';document.querySelectorAll('.detail-meta span').forEach((x,i)=>x.textContent=['来源','发布时间','市场版本','API记录'][i]);document.querySelector('.aside-card .kicker').textContent='原始报道';document.querySelector('#originalLink').innerHTML='打开来源 <span>↗</span>';}
</script></body></html>
