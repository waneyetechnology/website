<head>

<body><div id="siteHeader"></div><main id="main" class="page-shell">

</main><div id="siteFooter"></div><script src="../api-snapshot.js"></script><script src="../data.js"></script><script src="../pages.js"></script><script>
const P=WaneyePage;const region=P.safeRegion(P.query('region','global'));const zh=region==='cn';P.mountChrome('markets','../',zh?'zh':'en');const r=P.REPORTS[region];const requested=Number(P.query('sector','0'));const idx=Number.isInteger(requested)&&requested>=0&&requested<r.sectors.length?requested:0;const s=r.sectors[idx];
document.title=`${s.name} — Waneye`;document.querySelector('#crumbTitle').textContent=s.name;document.querySelector('#edition').textContent=zh?`${P.REGION_NAMES[region]}板块记录`:`${P.REGION_NAMES[region].toUpperCase()} SECTOR RECORD`;document.querySelector('#sectorTitle').textContent=s.name;document.querySelector('#sectorName').textContent=s.name;document.querySelector('#sectorTrend').textContent=s.trend;document.querySelector('#date').textContent=r.date;document.querySelector('#sourceIndexes').textContent=s.sourceIndexes.join(', ');document.querySelector('#apiRecord').textContent=`market_insights.sectors[${idx}]`;document.querySelector('#implication').textContent=s.implication;document.querySelector('#provenance').textContent=`${r.updatedAt} · api/v1/${region}/analysis.json`;document.querySelector('#reportLink').href=`../archive/report.html?region=${region}`;
if(zh){const crumbs=document.querySelectorAll('.breadcrumbs a');crumbs[0].textContent='市场情报';crumbs[1].textContent='市场板块';document.querySelectorAll('.detail-meta span').forEach((x,i)=>x.textContent=['报告日期','新闻来源索引','API记录'][i]);document.querySelector('.prose .kicker').textContent='投资含义';document.querySelector('.detail-aside .kicker').textContent='报告来源';document.querySelector('#reportLink').innerHTML='查看完整报告 <span>↗</span>';}
</script></body></html>
