name: Build and Deploy Waneye Financial Overview

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:
  push:
    branches:
      - master

# Serialize runs that share and refresh the same CLI credentials.
concurrency:
  group: deploy-cli-auth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout website-core
        uses: actions/checkout@v4
        with:
          repository: 'waneyetechnology/website-core'
          token: ${{ secrets.GH_PAT }}
          path: 'website-core'

      - name: Fetch existing images from gh-pages
        run: |
          # Check if gh-pages branch exists
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "Fetching existing images from gh-pages branch..."

            # Fetch gh-pages branch
            git fetch origin gh-pages:gh-pages

            # Check out the static/images directory from gh-pages branch
            if git show gh-pages:static/images/ > /dev/null 2>&1; then
              echo "Extracting images from gh-pages..."

              # Create the static/images directory structure in website-core
              mkdir -p website-core/static/images

              # Extract the entire static/images directory from gh-pages into current working directory
              git checkout gh-pages -- static/images/ 2>/dev/null || true

              # Count restored images and move to website-core
              if [ -d "static/images" ]; then
                image_count=$(find static/images -type f -name "*.jpg" -o -name "*.png" -o -name "*.webp" | wc -l)
                echo "Successfully restored $image_count existing images"
                mv static/images/* website-core/static/images/ 2>/dev/null || true
                rm -rf static/images
                echo "Directory structure:"
                ls -la website-core/static/images/ || true
              fi
            else
              echo "No images directory in gh-pages yet"
            fi
          else
            echo "gh-pages branch doesn't exist yet, starting fresh"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r website-core/requirements.txt
      - name: Install Playwright browsers
        run: |
          playwright install chromium
      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgtk-3-0 \
            libgbm1 \
            libasound2t64 \
            libxrandr2 \
            libxss1
      - name: Install agy CLI
        run: |
          curl --compressed -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify agy CLI installation
        run: agy --version
      - name: Install Codex CLI
        run: |
          curl --compressed -fsSL https://chatgpt.com/codex/install.sh -o "$RUNNER_TEMP/install-codex.sh"
          CODEX_NON_INTERACTIVE=1 sh "$RUNNER_TEMP/install-codex.sh"
          codex --version
      - name: Restore CLI authentication
        id: cli_auth
        env:
          AGY_AUTH_JSON: ${{ secrets.AGY_AUTH_JSON }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          umask 077
          mkdir -p "$HOME/.codex" "$HOME/.gemini/antigravity-cli"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          printf '%s' "$AGY_AUTH_JSON" > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          jq -e '.tokens | (.access_token | strings | length > 0) and (.refresh_token | strings | length > 0)' "$HOME/.codex/auth.json" > /dev/null
          jq -e '.token | (.access_token | strings | length > 0) and (.refresh_token | strings | length > 0)' "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" > /dev/null
          cp "$HOME/.codex/auth.json" "$RUNNER_TEMP/codex-auth-before.json"
          cp "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" "$RUNNER_TEMP/agy-auth-before.json"
      - name: Generate static site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_PROVIDER: ${{ secrets.AGY_PROVIDER }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
        run: |
          cd website-core
          python generate_site.py
      - name: Generate Chinese site
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_PROVIDER: ${{ secrets.AGY_PROVIDER }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
        run: |
          cd website-core
          python generate_site_cn.py
      - name: Generate Australian site
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_PROVIDER: ${{ secrets.AGY_PROVIDER }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
        run: |
          cd website-core
          python generate_site_au.py
      - name: Save refreshed CLI authentication
        if: ${{ always() && steps.cli_auth.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          failed=0
          save_auth() {
            local secret="$1" file="$2" original="$3" token_field="$4"
            if cmp -s "$file" "$original"; then
              return 0
            fi
            if ! jq -e --arg field "$token_field" '.[$field] | (.access_token | strings | length > 0) and (.refresh_token | strings | length > 0)' "$file" > /dev/null; then
              echo "::error::Refusing to save invalid $secret credentials"
              failed=1
              return 0
            fi
            if ! gh secret set "$secret" --repo "$GITHUB_REPOSITORY" < "$file"; then
              echo "::error::Could not save $secret; GH_PAT needs repository Secrets write access"
              failed=1
            fi
          }
          save_auth CODEX_AUTH_JSON "$HOME/.codex/auth.json" "$RUNNER_TEMP/codex-auth-before.json" tokens
          save_auth AGY_AUTH_JSON "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" "$RUNNER_TEMP/agy-auth-before.json" token
          exit "$failed"
      - name: Move generated artifacts
        run: |
          mv website-core/history ./history 2>/dev/null || true
          mv website-core/index.html ./
          mv website-core/archive ./archive
          mv website-core/markets ./markets
          mv website-core/newsroom ./newsroom
          mv website-core/cn ./cn 2>/dev/null || true
          mv website-core/au ./au 2>/dev/null || true
          rm -rf ./static
          mv website-core/static ./static
          rm -rf ./api
          mv website-core/api ./api 2>/dev/null || true
          rm -rf website-core
      - name: Push analysis report to history branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./history
          publish_branch: history
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "history: ${{ github.run_id }}"
      - name: Remove history folder before site deploy
        run: rm -rf history
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          cname: ''
